name: Verify demo URLs
on:
  push:
    branches: [claude/demo-verification]
    paths: ['urls*.json', 'verify.mjs', 'flows.mjs', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: verify
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node verify.mjs urls.json report && node flows.mjs
      - name: Commit results
        run: |
          git config user.name "demo-verifier"
          git config user.email "demo-verifier@users.noreply.github.com"
          git add results
          git commit -m "Verification results $(date -u +%FT%TZ) [skip ci]" || exit 0
          git pull --rebase
          git push
